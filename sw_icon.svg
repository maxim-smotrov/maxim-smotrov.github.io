  <title
     id="title1">Color sweep</title>
  <desc
     id="desc1">Three concentric circular segments with sharp corners. Coral arc shortened by 20 percent at the middle radius. Disk rotated counterclockwise to restore the mint lower edge and increase clearance between blue and the broom handle. Broom and dust circle preserve the latest edits. All artwork is editable vector geometry.</desc>
